<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_APP_TITLE%</title>
  </head>
  <body>
    <style type="text/css">
      #Loading {
        top: 0;
        left: 0;
        position: absolute;
        z-index: 100;
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #000;
      }

      .loading-text-container {
        font-size: 4rem;
        font-weight: bold;
        font-family: 'Arial', sans-serif;
        display: flex;
        gap: 0.5rem;
        position: relative;
      }

      .letter-outline {
        display: inline-block;
        color: transparent;
        -webkit-text-stroke: 2px #1890ff;
        text-transform:capitalize;
      }

      .letter-fill-container{
        position: absolute;
        left: 0;
        top: 0;
        display: flex;
        gap: 0.5rem;
      }

      .letter-fill {
        display: inline-block;
        color: white;
        transform: rotateY(90deg);
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        transform-origin: center;
        text-transform:capitalize;
      }

      @keyframes flipSequence {
        0%, 10% {
          transform: rotateY(90deg);
          opacity: 0;
        }
        20%, 50% {
          transform: rotateY(0deg);
          opacity: 1;
        }
        60%, 100% {
          transform: rotateY(90deg);
          opacity: 0;
        }
      }
    </style>
    <div id="app">
      <div id="Loading">
        <div class="loading-text-container" id="loadingContainer">
          <!-- 文字将通过JavaScript动态生成 -->
        </div>
      </div>
    </div>
    <script>
      // 动态生成loading文字和动画
      document.addEventListener('DOMContentLoaded', function() {
        const title = `%VITE_APP_TITLE%`; // Vite会在构建时替换这个值
        const container = document.getElementById('loadingContainer');
        
        // 创建背景边框文字
        const outlineContainer = document.createDocumentFragment();
        title.split('').forEach(char => {
          const span = document.createElement('span');
          span.className = 'letter-outline';
          span.textContent = char === ' ' ? '\u00A0' : char;
          outlineContainer.appendChild(span);
        });
        
        // 创建前景翻转文字容器
        const fillContainer = document.createElement('div');
        fillContainer.className = 'letter-fill-container';
        
        // 动态生成动画样式
        const style = document.createElement('style');
        let animationRules = '';
        const totalDuration = Math.max(3.0, title.length * 0.5); // 确保最小3秒
        const delayStep = totalDuration / (title.length + 2); // 计算每个字母的延迟
        
        title.split('').forEach((char, index) => {
          const span = document.createElement('span');
          span.className = 'letter-fill';
          span.textContent = char === ' ' ? '\u00A0' : char;
          fillContainer.appendChild(span);
          
          // 为每个字母生成动画规则
          const delay = delayStep * index;
          animationRules += `
          .loading-text-container .letter-fill-container .letter-fill:nth-child(${index + 1}) {
            animation: flipSequence ${totalDuration}s infinite ${delay}s;
          }`;
        });
        
        style.textContent = animationRules;
        document.head.appendChild(style);
        
        container.appendChild(outlineContainer);
        container.appendChild(fillContainer);
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
